<!doctype html>
<html lang="en" data-skin="glass" data-palette="ascendix" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>Stax · Stacking plan</title>
    <script>
      // The first paint is in the colours the link asks for (App keeps these attributes in step afterwards).
      (function () {
        try {
          var p = new URLSearchParams(location.search), r = document.documentElement, skin = p.get('skin'), theme = p.get('theme');
          if (skin === 'classic' || skin === 'aurora') {
            r.dataset.skin = skin === 'classic' ? 'classic' : 'glass';
            delete r.dataset.palette;
            delete r.dataset.theme;
          } else if (p.get('palette') === 'vice') r.dataset.palette = 'vice';
          if (theme === 'light' || theme === 'dark') r.dataset.theme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
